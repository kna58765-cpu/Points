<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>POINTS · 成员展示</title>
<style>
:root{color-scheme:light;--ink:#111;--muted:#888;--line:#e9e9e9;--paper:#f6f6f6}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:960px;margin:auto;padding:24px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 28px}
.brand{font-size:21px;font-weight:900;letter-spacing:3px}.brand span{font-weight:400;color:#999}
button,select{font:inherit;border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 13px;color:#111}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:1px}h1{font-size:clamp(30px,6vw,48px);letter-spacing:-2px;margin:10px 0}
.hero{background:#111;color:white;border-radius:22px;padding:28px;margin:24px 0;display:flex;justify-content:space-between;align-items:end;gap:16px}
.hero small{color:#aaa}.total{font-size:clamp(42px,9vw,68px);font-weight:800;letter-spacing:-2px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}
.cardtop{display:flex;align-items:center;gap:11px}.avatar{width:38px;height:38px;border-radius:12px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800}
.name{font-weight:750;flex:1}.group{font-size:12px;color:var(--muted);margin-top:4px}.score{font-size:27px;font-weight:800;margin-top:18px}.score small{font-size:11px;color:#999}
.section{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 13px}.section h2{font-size:18px;margin:0}
.list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.item{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid #eee;gap:12px}.item:last-child{border:0}
.left{display:flex;align-items:center;gap:12px}.rank{width:30px;height:30px;border-radius:10px;background:#f0f0f0;display:grid;place-items:center;font-weight:800}.muted{font-size:12px;color:#888;margin-top:4px}
.empty{padding:28px;text-align:center;color:#999;font-size:13px}.foot{margin-top:24px;color:#999;font-size:12px;text-align:center;line-height:1.7}
@media(max-width:520px){main{padding:18px 15px 45px}header{padding-bottom:20px}.hero{padding:22px}.section{align-items:flex-start}}
</style>
</head>
<body><main>
<header><div class="brand">POINTS<span> / DISPLAY</span></div><div style="display:flex;gap:8px;align-items:center"><select id="group"><option value="all">全部分组</option></select><button id="refresh">刷新</button></div></header>
<div class="eyebrow">TEAM SCOREBOARD / 团队积分看板</div><h1 id="team">我的团队</h1><div class="eyebrow" id="updated">等待本机数据…</div>
<section class="hero"><div><small>TEAM TOTAL POINTS</small><div class="total" id="total">0</div></div><div style="font-size:12px;color:#aaa;text-align:right">只读展示<br>不提供编辑入口</div></section>
<div class="section"><h2>成员排行榜</h2><span class="eyebrow" id="count">0 位成员</span></div><section class="list" id="ranking"></section>
<div class="section"><h2>成员积分</h2><span class="eyebrow">MEMBERS</span></div><section class="grid" id="members"></section>
<div class="foot">POINTS 只读展示页面<br>当前读取此浏览器设备的本地数据，不会自动同步其他设备。</div>
</main>
<script>
const KEY='points-v1', $=id=>document.getElementById(id);
let snapshot=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{snapshot=JSON.parse(localStorage.getItem(KEY)||'null')}catch{snapshot=null}render()}
function render(){
 const d=snapshot||{members:[],teamName:'我的团队'},members=Array.isArray(d.members)?d.members:[];
 const groups=[...new Set(members.map(m=>String(m.group||'未分组')))].sort((a,b)=>a.localeCompare(b,'zh-CN')),current=$('group').value;
 $('group').innerHTML='<option value="all">全部分组</option>'+groups.map(g=>'<option value="'+esc(g)+'">'+esc(g)+'</option>').join('');
 $('group').value=groups.includes(current)?current:'all';
 const visible=members.filter(m=>$('group').value==='all'||String(m.group||'未分组')===$('group').value).sort((a,b)=>(Number(b.points)||0)-(Number(a.points)||0));
 $('team').textContent=d.teamName||'我的团队';$('count').textContent=visible.length+' 位成员';
 $('total').textContent=visible.reduce((s,m)=>s+(Number(m.points)||0),0).toLocaleString();
 $('ranking').innerHTML=visible.length?visible.map((m,i)=>'<div class="item"><div class="left"><div class="rank">'+(i+1)+'</div><div><b>'+esc(m.name)+'</b><div class="muted">'+esc(m.group||'未分组')+'</div></div></div><b>'+Number(m.points||0).toLocaleString()+' PTS</b></div>').join(''):'<div class="empty">暂无成员数据</div>';
 $('members').innerHTML=visible.length?visible.map((m,i)=>'<article class="card"><div class="cardtop"><div class="avatar" style="background:'+(/^#[0-9a-f]{6}$/i.test(m.color||'')?m.color:'#111111')+'">'+(i+1)+'</div><div class="name">'+esc(m.name)+'<div class="group">'+esc(m.group||'未分组')+'</div></div></div><div class="score">'+Number(m.points||0).toLocaleString()+' <small>PTS</small></div></article>').join(''):'<div class="card empty">添加成员后，这里会显示成员积分。</div>';
 $('updated').textContent='最近刷新：'+new Date().toLocaleString();
}
$('group').addEventListener('change',render);$('refresh').addEventListener('click',load);window.addEventListener('storage',e=>{if(e.key===KEY)load()});
if('BroadcastChannel' in window){const channel=new BroadcastChannel('points-sync');channel.onmessage=e=>{if(e.data==='refresh')load()}}
load();
</script></body></html>
