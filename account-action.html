<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>POINTS · 账号安全</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f6f6f6;color:#111;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:min(100%,440px);background:#fff;border:1px solid #e9e9e9;border-radius:26px;padding:28px;box-shadow:0 12px 40px #0000000a}
.logo{font-size:22px;font-weight:900;letter-spacing:3px}.tag{color:#999;font-size:11px;letter-spacing:1.5px;margin-top:4px}
h1{font-size:25px;margin:26px 0 8px}.desc{color:#777;font-size:14px;line-height:1.7}
label{display:block;color:#666;font-size:13px;margin:18px 0 7px}
input{width:100%;padding:14px 15px;border:1px solid #e3e3e3;border-radius:15px;font:inherit;outline:none}
input:focus{border-color:#777}
button{width:100%;border:0;border-radius:15px;padding:14px;margin-top:18px;background:#111;color:#fff;font:inherit;font-weight:700}
button:disabled{opacity:.5}
.status{margin-top:16px;padding:13px;border-radius:14px;background:#f5f5f5;color:#555;font-size:13px;line-height:1.6;white-space:pre-wrap}
.status.ok{background:#eaf6ef;color:#16834a}.status.err{background:#fff0f0;color:#c33}
.hidden{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="logo">POINTS</div><div class="tag">ACCOUNT SECURITY</div>
  <h1 id="title">正在验证链接</h1>
  <p class="desc" id="desc">请稍候，正在检查邮件中的安全链接。</p>
  <section id="verifyForm" class="hidden">
    <label for="email">注册邮箱</label><input id="email" type="email" autocomplete="email" placeholder="输入注册时使用的邮箱">
    <label for="password">账号密码</label><input id="password" type="password" autocomplete="current-password" placeholder="输入账号密码以确认身份">
    <button id="verifyButton">确认邮箱验证</button>
  </section>
  <section id="recoveryForm" class="hidden">
    <label for="newPassword">新密码</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="至少 8 位">
    <label for="confirmPassword">再次输入新密码</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入新密码">
    <button id="resetButton">重设密码</button>
  </section>
  <div id="status" class="status">正在处理…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/appwrite@29.3.1"></script>
<script src="./appwrite-config.js"></script>
<script>
const params=new URLSearchParams(location.search);
const action=params.get('action'),userId=params.get('userId'),secret=params.get('secret');
const $=id=>document.getElementById(id),status=$('status');
function message(text,type=''){status.textContent=text;status.className='status '+type}
if(!userId||!secret){$('title').textContent='链接无效';$('desc').textContent='邮件链接缺少必要参数，请回到 POINTS 重新发送邮件。';message('链接可能已过期或不完整。','err')}
else if(action==='verify'){
  $('title').textContent='验证邮箱';$('desc').textContent='为保护账号安全，请输入注册邮箱和密码，然后完成邮箱验证。';$('verifyForm').classList.remove('hidden');message('验证链接已收到，请完成身份确认。');
  $('verifyButton').onclick=async()=>{
    const email=$('email').value.trim(),password=$('password').value,button=$('verifyButton');
    if(!email||!password)return message('请填写邮箱和密码。','err');
    button.disabled=true;button.textContent='正在验证…';
    try{await window.pointsCloud.confirmVerification(userId,secret,email,password);$('verifyForm').classList.add('hidden');$('title').textContent='邮箱验证成功';$('desc').textContent='你的 POINTS 邮箱已完成验证，可以返回应用继续使用。';message('邮箱验证成功！','ok')}
    catch(e){message('验证失败：'+(e.message||'请检查邮箱、密码或链接有效期。'),'err')}
    finally{button.disabled=false;button.textContent='确认邮箱验证'}
  };
}else if(action==='recovery'){
  $('title').textContent='重设密码';$('desc').textContent='请设置一个新的 POINTS 账号密码，至少 8 位。';$('recoveryForm').classList.remove('hidden');message('重设密码链接有效，请输入新密码。');
  $('resetButton').onclick=async()=>{
    const password=$('newPassword').value,again=$('confirmPassword').value,button=$('resetButton');
    if(password.length<8)return message('新密码至少需要 8 位。','err');
    if(password!==again)return message('两次输入的密码不一致。','err');
    button.disabled=true;button.textContent='正在保存…';
    try{await window.pointsCloud.completePasswordReset(userId,secret,password);$('recoveryForm').classList.add('hidden');$('title').textContent='密码已重设';$('desc').textContent='密码修改成功，请返回 POINTS 应用，使用新密码登录。';message('密码重设成功！','ok')}
    catch(e){message('重设失败：'+(e.message||'链接可能已过期，请重新申请。'),'err')}
    finally{button.disabled=false;button.textContent='重设密码'}
  };
}else{$('title').textContent='未知操作';$('desc').textContent='无法识别此账号操作。';message('请从 POINTS 应用重新发起操作。','err')}
</script>
</body>
</html>
