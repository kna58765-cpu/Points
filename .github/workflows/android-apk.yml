name: Build POINTS Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare app assets
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Pis app icons
        run: node scripts/generate-android-icons.mjs

      - name: Set Android app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s, code_count = re.subn(r'versionCode\s+\d+', 'versionCode 75077', s, count=1)
          s, name_count = re.subn(r'versionName\s+[\'\"][^\'\"]+[\'\"]', 'versionName "T077"', s, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit('Could not set Android versionCode/versionName')
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: POINTS-T077-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish official GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: POINTS-T077-Android-APK
          path: release-assets

      - name: Publish T077 release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: T077
          name: POINTS T077
          body: |
            POINTS T077 正式版

            - 页面布局更宽松，增加留白与行高
            - 液态玻璃调整为柔和毛玻璃材质
            - 优化窄屏文字显示，减少截断
            - 重点验证 T076 应用内更新流程
          files: release-assets/app-debug.apk
          draft: false
          prerelease: false
          make_latest: true
