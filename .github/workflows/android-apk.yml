name: Build POINTS Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare app assets
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Declare Android package installation permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in s:
              s = s.replace('<application', permission + '    <application', 1)
          p.write_text(s)
          print('Declared REQUEST_INSTALL_PACKAGES for the Android package installer')
          PY

      - name: Generate POINTS app icons
        run: node scripts/generate-android-icons.mjs

      - name: Configure fixed POINTS signing key
        env:
          POINTS_KEYSTORE_BASE64: ${{ secrets.POINTS_KEYSTORE_BASE64 }}
          POINTS_KEYSTORE_PASSWORD: ${{ secrets.POINTS_KEYSTORE_PASSWORD }}
          POINTS_KEY_ALIAS: ${{ secrets.POINTS_KEY_ALIAS }}
          POINTS_KEY_PASSWORD: ${{ secrets.POINTS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$POINTS_KEYSTORE_BASE64" || { echo "Missing POINTS_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$POINTS_KEYSTORE_PASSWORD" || { echo "Missing POINTS_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$POINTS_KEY_ALIAS" || { echo "Missing POINTS_KEY_ALIAS repository secret"; exit 1; }
          test -n "$POINTS_KEY_PASSWORD" || { echo "Missing POINTS_KEY_PASSWORD repository secret"; exit 1; }
          python3 - <<'PY'
          import base64, hashlib, os, re
          from pathlib import Path
          raw = os.environ["POINTS_KEYSTORE_BASE64"]
          # Remove whitespace only; restore omitted terminal Base64 padding without changing payload characters.
          encoded = re.sub(r"\s+", "", raw)
          padding = "=" * (-len(encoded) % 4)
          print(f"Signing secret character count (excluding whitespace): {len(encoded)}")
          print(f"Base64 padding characters restored: {len(padding)}")
          invalid = [(i + 1, ord(ch)) for i, ch in enumerate(encoded) if ch not in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="]
          if invalid:
              preview = ", ".join(f"position {i} (character code {code})" for i, code in invalid[:20])
              raise SystemExit(f"Base64 contains {len(invalid)} invalid non-whitespace character(s): {preview}. Secret contents were not printed.")
          if len(encoded) % 4 == 1:
              raise SystemExit("Base64 length is invalid (remainder 1 when divided by 4); this indicates missing or extra content, not missing terminal padding. Secret contents were not printed.")
          try:
              data = base64.b64decode(encoded + padding, validate=True)
          except Exception as exc:
              raise SystemExit(f"Strict Base64 decoding failed ({type(exc).__name__}). Secret contents were not printed.")
          header = data[:8].hex()
          print(f"Decoded keystore byte count: {len(data)}")
          print(f"Decoded file header (first 8 bytes, hex): {header}")
          print(f"Decoded file SHA-256: {hashlib.sha256(data).hexdigest()}")
          if data.startswith(bytes.fromhex("feedfeed")):
              store_type = "JKS"
          elif data.startswith(bytes.fromhex("30")):
              store_type = "PKCS12"
          else:
              raise SystemExit("Decoded bytes are not recognized as JKS/PKCS12. Compare the diagnostic length/header with the original file locally; secret contents were not printed.")
          key_path = Path(os.environ["RUNNER_TEMP"], "points-release-key." + ("jks" if store_type == "JKS" else "p12"))
          key_path.write_bytes(data)
          Path(os.environ["RUNNER_TEMP"], "points-keystore-type").write_text(store_type)
          PY
          STORE_TYPE="$(cat "$RUNNER_TEMP/points-keystore-type")"
          KEY_EXT="p12"
          [ "$STORE_TYPE" = "JKS" ] && KEY_EXT="jks"
          export POINTS_KEYSTORE_PATH="$RUNNER_TEMP/points-release-key.$KEY_EXT"
          echo "POINTS_KEYSTORE_PATH=$POINTS_KEYSTORE_PATH" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'signingConfigs {' not in s:
              pos = s.find('buildTypes {')
              if pos < 0:
                  raise SystemExit('Gradle buildTypes block not found')
              signing = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("POINTS_KEYSTORE_PATH"))
                      storePassword System.getenv("POINTS_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("POINTS_KEY_ALIAS")
                      keyPassword System.getenv("POINTS_KEY_PASSWORD")
                  }
              }
              '''
              s = s[:pos] + signing + s[pos:]
          pos = s.find('buildTypes {')
          if pos < 0:
              raise SystemExit('Gradle buildTypes block not found after signing setup')
          insert = pos + len('buildTypes {')
          s = s[:insert] + '\n        debug { signingConfig signingConfigs.release }' + s[insert:]
          p.write_text(s)
          PY
          STORE_TYPE="$(cat "$RUNNER_TEMP/points-keystore-type")"
          keytool -list -v -storetype "$STORE_TYPE" -keystore "$POINTS_KEYSTORE_PATH" -storepass "$POINTS_KEYSTORE_PASSWORD" -alias "$POINTS_KEY_ALIAS"

      - name: Set Android app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s, code_count = re.subn(r"versionCode\s+\d+", "versionCode 75091", s, count=1)
          s, name_count = re.subn(r"""versionName\s+["'][^"']+["']""", 'versionName "T090"', s, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit('Could not set Android versionCode/versionName')
          p.write_text(s)
          PY

      - name: Build signed APK
        working-directory: android
        env:
          POINTS_KEYSTORE_PASSWORD: ${{ secrets.POINTS_KEYSTORE_PASSWORD }}
          POINTS_KEY_ALIAS: ${{ secrets.POINTS_KEY_ALIAS }}
          POINTS_KEY_PASSWORD: ${{ secrets.POINTS_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SIGNER_OUTPUT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK")"
          echo "$SIGNER_OUTPUT"
          EXPECTED_CERT="fe1f4116fca2faf2b79a3a92296c99d2396bf8b5dee1c753942525fff9a4aedc"
          ACTUAL_CERT="$(printf '%s\n' "$SIGNER_OUTPUT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL_CERT" && test "$ACTUAL_CERT" = "$EXPECTED_CERT" || { echo "APK signer fingerprint does not match the fixed POINTS signing certificate"; exit 1; }
          mkdir -p release-assets
          cp "$APK" release-assets/POINTS-T090.apk

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: POINTS-T090-Android-APK
          path: release-assets/POINTS-T090.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish official GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: POINTS-T090-Android-APK
          path: release-assets

      - name: Replace previous T090 APK asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset T090 POINTS-T090.apk --yes || true

      - name: Publish T090 release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: T090
          name: POINTS T090
          body: |
            POINTS T090 正式版

            - 优化主界面布局、按钮样式和卡片间距
            - 邀请码每 24 小时自动随机轮换，无需手动生成
            - 最新邀请码直接显示在邀请码按钮内，点击按钮即可复制
            - 保持原固定签名，支持覆盖安装并保留数据
          files: release-assets/POINTS-T090.apk
          draft: false
          prerelease: false
          make_latest: true

      - name: Explicitly mark T090 as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit T090 --latest --repo kna58765-cpu/Points
