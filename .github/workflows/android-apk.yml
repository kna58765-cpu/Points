name: Build POINTS Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare app assets
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate POINTS app icons
        run: node scripts/generate-android-icons.mjs

      - name: Configure fixed POINTS signing key
        env:
          POINTS_KEYSTORE_BASE64: ${{ secrets.POINTS_KEYSTORE_BASE64 }}
          POINTS_KEYSTORE_PASSWORD: ${{ secrets.POINTS_KEYSTORE_PASSWORD }}
          POINTS_KEY_ALIAS: ${{ secrets.POINTS_KEY_ALIAS }}
          POINTS_KEY_PASSWORD: ${{ secrets.POINTS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$POINTS_KEYSTORE_BASE64" || { echo "Missing POINTS_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$POINTS_KEYSTORE_PASSWORD" || { echo "Missing POINTS_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$POINTS_KEY_ALIAS" || { echo "Missing POINTS_KEY_ALIAS repository secret"; exit 1; }
          test -n "$POINTS_KEY_PASSWORD" || { echo "Missing POINTS_KEY_PASSWORD repository secret"; exit 1; }
          echo "$POINTS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/points-release-key.jks"
          export POINTS_KEYSTORE_PATH="$RUNNER_TEMP/points-release-key.jks"
          echo "POINTS_KEYSTORE_PATH=$POINTS_KEYSTORE_PATH" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          signing = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("POINTS_KEYSTORE_PATH"))
                      storePassword System.getenv("POINTS_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("POINTS_KEY_ALIAS")
                      keyPassword System.getenv("POINTS_KEY_PASSWORD")
                  }
              }
          '''
          if 'signingConfigs {' not in s:
              s, n = re.subn(r'(?m)^\s*buildTypes\s*\{', signing + '\n            buildTypes {', s, count=1)
              if n != 1:
                  raise SystemExit('Could not add fixed signing configuration')
          if re.search(r'(?m)^\s*debug\s*\{', s):
              s, n = re.subn(r'(?m)^(\s*)debug\s*\{', r'\1debug {\n\1    signingConfig signingConfigs.release', s, count=1)
              if n != 1:
                  raise SystemExit('Could not configure debug signing')
          else:
              s, n = re.subn(r'(?m)^(\s*)buildTypes\s*\{', r'\1buildTypes {\n\1    debug { signingConfig signingConfigs.release }', s, count=1)
              if n != 1:
                  raise SystemExit('Could not add debug build type')
          p.write_text(s)
          PY
          keytool -list -v -keystore "$POINTS_KEYSTORE_PATH" -storepass "$POINTS_KEYSTORE_PASSWORD" -alias "$POINTS_KEY_ALIAS"

      - name: Set Android app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s, code_count = re.subn(r'versionCode\s+\d+', 'versionCode 75082', s, count=1)
          s, name_count = re.subn(r'versionName\s+[\'\"][^\'\"]+[\'\"]', 'versionName "T082"', s, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit('Could not set Android versionCode/versionName')
          p.write_text(s)
          PY

      - name: Build signed APK
        working-directory: android
        env:
          POINTS_KEYSTORE_PASSWORD: ${{ secrets.POINTS_KEYSTORE_PASSWORD }}
          POINTS_KEY_ALIAS: ${{ secrets.POINTS_KEY_ALIAS }}
          POINTS_KEY_PASSWORD: ${{ secrets.POINTS_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SIGNER_OUTPUT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK")"
          echo "$SIGNER_OUTPUT"
          EXPECTED_CERT="FE:1F:41:16:FC:A2:FA:F2:B7:9A:3A:92:29:6C:99:D2:39:6B:F8:B5:DE:E1:C7:53:94:25:25:FF:F9:A4:AE:DC"
          echo "$SIGNER_OUTPUT" | grep -Fq "$EXPECTED_CERT" || { echo "APK signer fingerprint does not match the fixed POINTS signing certificate"; exit 1; }
          mkdir -p release-assets
          cp "$APK" release-assets/POINTS-T082.apk

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: POINTS-T082-Android-APK
          path: release-assets/POINTS-T082.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish official GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: POINTS-T082-Android-APK
          path: release-assets

      - name: Publish T082 release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: T082
          name: POINTS T082
          body: |
            POINTS T082 正式版

            - 应用内版本号与正式 APK 统一为 T082
            - 修复团队邀请码生成后不可见的问题，支持直接复制分享
            - 验证手动检查更新流程与安装状态提示
            - 保持原固定签名，覆盖安装并保留数据
          files: release-assets/POINTS-T082.apk
          draft: false
          prerelease: false
          make_latest: true
